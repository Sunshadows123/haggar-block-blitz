<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Blitz">
<meta name="theme-color" content="#120a2a">
<title>Haggar Block Blitz</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="bg"></div>

<section id="menu" class="screen active">
  <h1 class="logo"><span>HAGGAR</span><b>BLOCK BLITZ</b></h1>
  <div class="stats-row"><div>🏆 <b id="mHigh">0</b></div><div>🪙 <b id="mCoins">0</b></div></div>
  <div class="menu-btns">
    <button class="big" data-go="game" id="btnPlay">▶ PLAY</button>
    <button data-go="shop">🛒 Shop</button>
    <button data-go="leader">🌍 Leaderboard</button>
    <button data-go="codex">📖 Power Codex <small id="mCodex"></small></button>
    <button data-go="settings">⚙️ Settings</button>
  </div>
  <p class="tip">Clear rows &amp; columns to win one of 100 power-ups. 5 minutes. Don't get stuck!</p>
</section>

<section id="game" class="screen">
  <div class="hud">
    <button class="icon" id="btnPause">☰</button>
    <div class="hudbox"><small>SCORE</small><b id="score">0</b></div>
    <div class="hudbox timer"><small>TIME</small><b id="time">5:00</b></div>
    <div class="hudbox"><small>🪙</small><b id="gCoins">0</b></div>
  </div>
  <div id="effects"></div>
  <div id="boardWrap"><div id="board"></div><div id="combo"></div></div>
  <div id="tray"></div>
  <div id="invBar"><div id="inv"></div><button id="btnBuyPiece" title="Buy a block">🧩</button></div>
  <div id="banner"></div>
</section>

<section id="shop" class="screen">
  <div class="top"><button class="icon" data-go="menu">←</button><h2>Shop</h2><div>🪙 <b class="coinsLbl">0</b></div></div>
  <div class="scroll" id="shopList"></div>
</section>

<section id="codex" class="screen">
  <div class="top"><button class="icon" data-go="menu">←</button><h2>Power Codex</h2><div id="codexCount"></div></div>
  <div class="scroll"><div id="codexGrid"></div></div>
</section>

<section id="leader" class="screen">
  <div class="top"><button class="icon" data-go="menu">←</button><h2>Leaderboard</h2><div></div></div>
  <div class="tabs"><button id="tabScore" class="on">🏆 Best Score</button><button id="tabCoins">🪙 Most Coins</button></div>
  <div id="myRank"></div>
  <div class="scroll" id="lbList"></div>
</section>

<section id="settings" class="screen">
  <div class="top"><button class="icon" data-go="menu">←</button><h2>Settings</h2><div></div></div>
  <div class="scroll">
    <label class="row">Sound effects <input type="checkbox" id="setSound"></label>
    <label class="row">Animations &amp; particles <input type="checkbox" id="setAnim"></label>
    <label class="row">Vibration <input type="checkbox" id="setVib"></label>
    <label class="row">Username <span><b id="setName">-</b> <button id="btnRename" style="padding:6px 10px">Change</button></span></label>
    <button id="btnReset" class="danger">Reset all progress</button>
  </div>
</section>

<div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>
<div id="reveal" class="hidden"></div>
<div id="toast"></div>
<div id="transition"></div>
<div id="fx"></div>
<script src="powers.js"></script>
<script src="game.js"></script>
</body></html>
